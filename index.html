<style>
:root{
  --bg:#E8EEF3; --ink:#14283C; --mute:#6E8397; --line:#C9D5E0;
  --rain:#2F6FB5; --rain-heavy:#0C3D7A; --now:#D2643C; --card:#F6F9FB;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
body{padding:calc(env(safe-area-inset-top) + 16px) 16px 32px;max-width:560px;margin:0 auto}
h1{font-size:15px;font-weight:600;color:var(--mute);margin:0 0 4px;letter-spacing:.01em}
.place{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:18px}
.place b{font-size:22px;font-weight:700}
.place button{background:none;border:0;color:var(--rain);font:inherit;font-size:15px;padding:0;cursor:pointer;text-decoration:underline}
.verdict{font-size:30px;font-weight:700;line-height:1.15;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 16px;font-size:15px}
.chart{background:var(--card);border-radius:14px;padding:14px 10px 6px}
svg{width:100%;height:auto;display:block}
.bar{fill:var(--rain)} .bar.heavy{fill:var(--rain-heavy)}
.axis{stroke:var(--line);stroke-width:1}
.lbl{font-size:11px;fill:var(--mute)} .ylbl{font-size:10px;fill:var(--mute)}
.nowline{stroke:var(--now);stroke-width:1.5;stroke-dasharray:3 3}
.meta{color:var(--mute);font-size:13px;margin-top:14px;line-height:1.5}
.meta a{color:inherit}
.err{background:#FBE9E3;color:#7A2E12;padding:12px 14px;border-radius:10px;margin:12px 0}
.panel{display:none;background:var(--card);border-radius:14px;padding:14px;margin-bottom:16px}
.panel.open{display:block}
.panel label{display:block;font-size:13px;color:var(--mute);margin:8px 0 4px}
.panel input{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.row{display:flex;gap:8px}
.row>*{flex:1}
.btn{margin-top:12px;background:var(--ink);color:#fff;border:0;border-radius:9px;padding:11px 14px;font:inherit;font-weight:600;width:100%;cursor:pointer}
.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.bar{transition:height .3s,y .3s}}
</style>
</head>
<body>
<h1>Regnkollen — nästa 90 minuter</h1>
<div class="place"><b id="placeName">Hämtar plats…</b><button id="editBtn">byt plats</button></div>

<div class="panel" id="panel">
  <div class="chips" id="chips"></div>
  <div class="row">
    <div><label>Lat</label><input id="lat" inputmode="decimal" placeholder="57.7089"></div>
    <div><label>Lon</label><input id="lon" inputmode="decimal" placeholder="11.9746"></div>
  </div>
  <button class="btn" id="useCoords">Visa för koordinater</button>
  <button class="btn light" id="useGeo">Använd min position</button>
</div>

<p class="verdict" id="verdict">&nbsp;</p>
<p class="sub" id="sub">&nbsp;</p>
<div id="err"></div>
<div class="chart"><svg id="svg" viewBox="0 0 360 200" aria-label="Nederbörd kommande 90 minuter"></svg></div>
<p class="meta" id="meta">Radar-nowcast från <a href="https://api.met.no/weatherapi/nowcast/2.0/documentation" target="_blank" rel="noopener">MET Norway</a> (samma radarextrapolering som Yr). Täcker Norden. Uppdateras var 5:e minut.</p>

<script>
const PRESETS=[["Göteborg",57.7089,11.9746],["Stockholm",59.3293,18.0686],["Malmö",55.6050,13.0038],["Oslo",59.9139,10.7522]];
const $=id=>document.getElementById(id);
let cur=null, timer=null;

$('editBtn').onclick=()=>$('panel').classList.toggle('open');
$('useGeo').onclick=()=>{$('panel').classList.remove('open');locate();};
$('useCoords').onclick=()=>{
  const la=parseFloat($('lat').value.replace(',','.')),lo=parseFloat($('lon').value.replace(',','.'));
  if(isNaN(la)||isNaN(lo)){showErr('Ange lat och lon som decimaltal.');return;}
  $('panel').classList.remove('open'); load(la,lo,la.toFixed(3)+', '+lo.toFixed(3));
};
PRESETS.forEach(([n,la,lo])=>{const c=document.createElement('button');c.className='chip';c.textContent=n;
  c.onclick=()=>{$('panel').classList.remove('open');load(la,lo,n);};$('chips').appendChild(c);});

function showErr(m){$('err').innerHTML=m?`<div class="err">${m}</div>`:'';}

function locate(){
  $('placeName').textContent='Hämtar plats…';
  if(!navigator.geolocation){load(...PRESETS[0].slice(1),PRESETS[0][0]);return;}
  navigator.geolocation.getCurrentPosition(
    p=>load(p.coords.latitude,p.coords.longitude,'Min position'),
    ()=>{showErr('Kunde inte hämta position — visar Göteborg.');load(PRESETS[0][1],PRESETS[0][2],PRESETS[0][0]);},
    {timeout:8000,maximumAge:60000});
}

async function load(lat,lon,name){
  cur={lat,lon,name}; showErr('');
  $('placeName').textContent=name+(name==='Min position'?` (${lat.toFixed(3)}, ${lon.toFixed(3)})`:'');
  $('verdict').textContent='Hämtar radar…'; $('sub').textContent='';
  try{
    const r=await fetch(`https://api.met.no/weatherapi/nowcast/2.0/complete?lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}`);
    if(r.status===422) throw new Error('Platsen ligger utanför radartäckning (Norden).');
    if(!r.ok) throw new Error('API-fel '+r.status);
    const j=await r.json();
    const cov=j.properties.meta.radar_coverage;
    if(cov&&cov!=='ok') throw new Error(cov==='no coverage'?'Ingen radartäckning här.':'Radar tillfälligt otillgänglig.');
    const ts=j.properties.timeseries.map(t=>({t:new Date(t.time),v:t.data.instant.details.precipitation_rate||0}));
    render(ts,new Date(j.properties.meta.updated_at));
  }catch(e){
    $('verdict').textContent='Ingen data'; $('sub').textContent='';
    $('svg').innerHTML='';
    showErr(e.message+(e.message.includes('fetch')?' — api.met.no kräver User-Agent; kan behöva proxy.':''));
  }
  clearTimeout(timer); timer=setTimeout(()=>cur&&load(cur.lat,cur.lon,cur.name),5*60*1000);
}

const hm=d=>d.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});

function render(ts,updated){
  const now=new Date();
  const max=Math.max(...ts.map(p=>p.v));
  const first=ts.find(p=>p.v>=0.1);
  const stopIdx=ts.findIndex((p,i)=>i>0&&ts[i-1].v>=0.1&&p.v<0.1);
  const totalMm=ts.reduce((s,p)=>s+p.v*5/60,0); // mm/h × 5 min

  if(max<0.1){$('verdict').textContent='Uppehåll de närmaste 90 min';$('sub').textContent='Radarn ser ingen nederbörd på väg.';}
  else{
    const minsTo=Math.round((first.t-now)/60000);
    if(minsTo<=2){
      $('verdict').textContent=stopIdx>0?`Regnar nu, slutar ca ${hm(ts[stopIdx].t)}`:'Regnar nu och hela perioden';
    } else $('verdict').textContent=`Regn om ca ${minsTo} min`;
    $('sub').textContent=`Max ${max.toFixed(1)} mm/h · totalt ~${totalMm.toFixed(1)} mm på 90 min`;
  }
  $('meta').innerHTML=`Radar uppdaterad ${hm(updated)} · nowcast från <a href="https://api.met.no/weatherapi/nowcast/2.0/documentation" target="_blank" rel="noopener">MET Norway</a> (samma radarextrapolering som Yr). Uppdateras automatiskt var 5:e minut.`;

  // chart
  const W=360,H=200,L=30,R=8,T=12,B=28,n=ts.length;
  const yMax=Math.max(1,Math.ceil(max*1.1*2)/2);
  const pw=W-L-R, ph=H-T-B, bw=pw/n;
  const y=v=>T+ph-(v/yMax)*ph;
  let s='';
  const steps=yMax<=2?0.5:yMax<=5?1:yMax<=10?2:5;
  for(let v=0;v<=yMax+1e-9;v+=steps){
    s+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/>`;
    s+=`<text class="ylbl" x="${L-4}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  }
  ts.forEach((p,i)=>{
    const h=Math.max(0,T+ph-y(p.v)); const x=L+i*bw;
    s+=`<rect class="bar${p.v>=2?' heavy':''}" x="${x+1}" y="${y(p.v)}" width="${bw-2}" height="${h}" rx="1"/>`;
    if(p.t.getMinutes()%15===0) s+=`<text class="lbl" x="${x+bw/2}" y="${H-10}" text-anchor="middle">${hm(p.t)}</text>`;
  });
  s+=`<text class="ylbl" x="${L-4}" y="${T-3}" text-anchor="end">mm/h</text>`;
  const nx=L+((now-ts[0].t)/(ts[n-1].t-ts[0].t))*(pw-bw)+bw/2;
  if(nx>=L&&nx<=W-R) s+=`<line class="nowline" x1="${nx}" x2="${nx}" y1="${T}" y2="${T+ph}"/>`;
  $('svg').innerHTML=s;
}
locate();
</script>
</body>
</html>
